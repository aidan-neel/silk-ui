name: Publish @sivir-ui/svelte

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to publish (for example v0.1.0)
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    package:
        name: Verify release package
        uses: ./.github/workflows/ci.yml
        with:
            ref: ${{ github.event.release.tag_name || inputs.tag }}
            release-tag: ${{ github.event.release.tag_name || inputs.tag }}
            upload-artifact: true

    publish:
        name: Publish verified package artifact
        needs: package
        runs-on: ubuntu-latest
        steps:
            - name: Setup npm registry
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Download verified package
              uses: actions/download-artifact@v4
              with:
                  name: sivir-package
                  path: packages/sivir/.release

            - name: Publish verified tarball
              run: npm publish packages/sivir/.release/*.tgz --access public --provenance --ignore-scripts
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
