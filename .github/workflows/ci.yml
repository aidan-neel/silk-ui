name: Release checks

on:
    workflow_call:
        inputs:
            ref:
                description: Git ref to verify
                required: false
                type: string
            release-tag:
                description: Release tag that must match the package version
                required: false
                type: string
            upload-artifact:
                description: Upload the verified package for a downstream publish job
                required: false
                default: false
                type: boolean
    pull_request:
        branches: [main]
    push:
        branches: [main]
    merge_group:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    package:
        name: Release package
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            LEFTHOOK: 0
            TURBO_TELEMETRY_DISABLED: 1
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Cache Bun install
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Cache Turbo
              uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ runner.os }}-turbo-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Dependency audit
              run: bun audit

            - name: Verify release tag matches package version
              if: inputs.release-tag != ''
              env:
                  RELEASE_TAG: ${{ inputs.release-tag }}
              run: |
                  node --input-type=module <<'NODE'
                  import packageJson from './packages/sivir/package.json' with { type: 'json' };

                  const expectedTag = `v${packageJson.version}`;

                  if (process.env.RELEASE_TAG !== expectedTag) {
                      console.error(`Release tag must be ${expectedTag}`);
                      process.exit(1);
                  }
                  NODE

            - name: Install Playwright Chromium
              # Keep the browser binary aligned with the Playwright version pinned in
              # bun.lock; resolving a different CLI version can install the wrong build.
              run: |
                  PW_VERSION=$(basename "$(ls -d node_modules/.bun/playwright@* | head -1)" | cut -d'@' -f2)
                  echo "Installing Playwright $PW_VERSION browsers"
                  bunx "playwright@${PW_VERSION}" install --with-deps chromium

            - name: Format check
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Typecheck
              run: bun run check

            - name: Test (unit + ssr)
              run: bun --filter='docs' run test:ci

            - name: Test (registry)
              run: bun --filter='registry' run test

            - name: Test (sivir package)
              run: bun --filter='@sivir-ui/svelte' run test

            - name: Test (browser)
              run: bun --filter='docs' run test:browser

            - name: Build
              run: bun run build

            - name: Build standalone docs deployment
              run: DOCS_ADAPTER=node bun --filter='docs' run build

            - name: Verify standalone docs handler has no runtime dependencies
              run: |
                  runtime_dir=$(mktemp -d)
                  cp -R apps/docs/build "$runtime_dir/build"
                  cp package.json "$runtime_dir/package.json"
                  cd "$runtime_dir"
                  node -e "import('./build/handler.js')"

            - name: Test CLI in a fresh consumer
              run: bun --filter='@sivir-ui/svelte' run sandbox

            - name: Verify packed package in a fresh SvelteKit consumer
              run: bun --filter='@sivir-ui/svelte' run verify:artifact

            - name: Verify CLI source-copy from retained tarball
              run: bun --filter='@sivir-ui/svelte' run verify:cli-artifact

            - name: Test installer lab
              run: bun --cwd apps/installer-lab test

            - name: Upload verified package
              if: inputs.upload-artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sivir-package
                  path: packages/sivir/.release/*.tgz
                  if-no-files-found: error
                  include-hidden-files: true
                  retention-days: 1
